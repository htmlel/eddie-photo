<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eddie's Darkroom</title>
  <style>
    body {
      margin: 0;
      background: #e5e1d3;
      color: black;
      font-family: sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease; /* Smooth transition */
    }

    /* Shared styles for both modes */
    .view {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 40px;
      position: absolute;
      top: 0;
      left: 0;
    }

    .landing {
      background: #e5e1d3;
      z-index: 2;
    }

    .darkroom {
      background-color: #0b0b0b;
      z-index: 1;
      display: none; /* Hidden by default */
    }

    /* Fixed the image display here */
    .display-image {
      width: 90vw;
      max-width: 700px;
      aspect-ratio: 3/2;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      object-fit: cover;
    }

    .light-switch {
      position: fixed;
      width: 80px;
      height: 140px;
      cursor: pointer;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .light-switch {
        left: 50%;
        top: 65%;
        transform: translate(-50%, -50%);
      }
    }

    @media (min-width: 769px) {
      .light-switch {
        left: 30px;
        top: 50%;
        transform: translateY(-50%);
      }
    }

    .light-switch img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
  <script>
    function enterDarkroom() {
      const switchImg = document.getElementById("switchImg");
      const landing = document.getElementById("landing");
      const darkroom = document.getElementById("darkroom");

      // Check if landing is currently visible
      const isDayMode = window.getComputedStyle(landing).display === "flex";

      if (isDayMode) {
        // Switch to DARK
        switchImg.src = "images/darkmode_switch.png";
        landing.style.display = "none";
        darkroom.style.display = "flex";
        document.body.style.backgroundColor = "#0b0b0b";
      } else {
        // Switch to DAY
        switchImg.src = "images/lightmode_switch.png";
        landing.style.display = "flex";
        darkroom.style.display = "none";
        document.body.style.backgroundColor = "#e5e1d3";
      }
    }
  </script>
</head>
<body>
  <div class="light-switch" onclick="enterDarkroom()">
    <img id="switchImg" src="images/lightmode_switch.png" alt="Switch" />
  </div>

  <div class="view landing" id="landing">
    <img src="images/image-1.jpeg" class="display-image" alt="Emotional photo">
  </div>

  <div class="view darkroom" id="darkroom">
    <img src="images/image-1.jpeg" class="display-image" alt="Emotional photo">
  </div>
</body>
</html>
